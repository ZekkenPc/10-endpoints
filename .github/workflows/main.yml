name: CI/CD - Test, Build & Deploy

# Se ejecuta en push y pull_request a main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: 10-endpoints
  CONTAINER_NAME: 10-endpoints

jobs:
  # ------------------------------------------------------------
  # 1) PRUEBAS (corre en push y en pull_request)
  # ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Jest corre las pruebas y muestra la tabla de cobertura en los logs
      - name: Ejecutar pruebas con cobertura
        run: npm test

  # ------------------------------------------------------------
  # 2) BUILD & PUSH a Docker Hub (solo en push a main)
  # ------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Autenticación con Personal Access Token (nunca la contraseña)
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen (:latest y :hash del commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ------------------------------------------------------------
  # 3) DEPLOY en AWS EC2 por SSH (solo en push a main)
  # ------------------------------------------------------------
  deploy-ec2:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Descargar la versión más reciente
            docker pull $IMAGE

            # Detener y eliminar el contenedor antiguo (si existe)
            docker rm -f ${{ env.CONTAINER_NAME }} || true

            # Carpeta en el host para que la base de datos sobreviva a cada deploy
            mkdir -p $HOME/data

            # Levantar la nueva versión mapeada al puerto 80
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 80:80 \
              -e DB_PATH=/data/database.sqlite \
              -e BACKUP_PATH=/data/backup.sqlite \
              -v $HOME/data:/data \
              $IMAGE

            # Limpiar imágenes viejas para no llenar el disco
            docker image prune -f
